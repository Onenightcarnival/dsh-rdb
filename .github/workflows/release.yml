# Release: push a tag like v1.2.3 (or v1.2.3-rc.1) and this workflow builds
# the plugin, packs it as dsh-rdb-<version>.tgz and attaches it to a GitHub
# Release for that tag. The version inside the tarball always comes from the
# tag name, not from the version field committed in package.json.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag format
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' is not in vX.Y.Z or vX.Y.Z-prerelease form"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set package version from tag
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Pack
        id: pack
        run: |
          file=$(npm pack --json | node -e 'process.stdin.on("data",d=>process.stdout.write(JSON.parse(d)[0].filename))')
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "Packed $file"
          tar -tzf "$file"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--title "$GITHUB_REF_NAME" --generate-notes)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${{ steps.pack.outputs.file }}" "${args[@]}"
